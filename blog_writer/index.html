<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor - Alper Sen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Tema Değişkenleri (Sitenden Alınan) */
            --bg: #0a0a0a;
            --text: #ededed;
            --accent: #888888;
            --dim: #555555;
            --quote-border: #333;
            --ref-bg: #111;
            --ref-border: #222;
            --ref-text: #aaa;
            
            /* Editöre Özel Arayüz Renkleri */
            --editor-ui-bg: #1a1a1a;
            --editor-ui-border: #333333;
            --btn-hover: #444444;

            /* Kod Bloğu Renkleri (Dark/Terminal Aesthetic) */
            --code-bg: #050505;
            --code-border: #222222;
            --code-text: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            line-height: 1.8;
        }

        /* Üst Menü (Editör Kontrolleri) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            border-bottom: 1px solid var(--editor-ui-border);
            background-color: var(--editor-ui-bg);
            z-index: 10;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-wrap: wrap;
            row-gap: 8px;
        }

        .tb-group {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .tb-divider {
            width: 1px;
            height: 22px;
            background-color: var(--editor-ui-border);
            margin: 0 10px;
        }

        button {
            background-color: var(--bg);
            color: var(--text);
            border: 1px solid var(--editor-ui-border);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        button:hover {
            background-color: var(--btn-hover);
            border-color: var(--text);
        }

        /* Araç çubuğundaki butonlar: sabit boyutlu, ikon-öncelikli, sade "ghost" görünüm */
        .toolbar button {
            width: 36px;
            height: 36px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            border-color: transparent;
        }

        .toolbar button:hover {
            background-color: var(--btn-hover);
            border-color: transparent;
        }

        .toolbar button svg {
            width: 16px;
            height: 16px;
        }

        .file-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .download-btn {
            background-color: var(--text);
            color: var(--bg);
            font-weight: 600;
        }

        .download-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        /* Editör Alanı */
        .editor-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 60px 24px 100px 24px;
            display: flex;
            justify-content: center;
        }

        #editor {
            width: 100%;
            max-width: 680px;
            outline: none;
            /* Article Stilleri */
            font-size: 1.15rem;
            font-weight: 300;
            color: var(--text);
        }

        /* Sitenin Birebir Tipografisi */
        #editor h1 {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
            color: var(--text);
        }

        #editor p {
            margin-bottom: 28px;
        }

        #editor blockquote {
            border-left: 2px solid var(--quote-border);
            padding-left: 24px;
            margin: 40px 0;
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 1.3rem;
            color: var(--text);
        }

        #editor .highlight {
            color: var(--text);
            font-weight: 400;
            border-bottom: 1px solid var(--accent);
        }

        #editor .academic-ref {
            background: var(--ref-bg);
            border: 1px solid var(--ref-border);
            padding: 25px;
            border-radius: 12px;
            margin: 40px 0;
            font-size: 1rem;
            color: var(--ref-text);
        }

        #editor .academic-ref strong {
            color: var(--text);
            display: inline-block;
            margin-bottom: 8px;
        }

        /* YENİ: Liste Stilleri (Bulleted/Numbered) */
        #editor ul, #editor ol {
            margin-bottom: 28px;
            padding-left: 28px;
        }

        #editor li {
            margin-bottom: 10px;
        }

        /* YENİ: Link Stilleri */
        #editor a {
            color: var(--text);
            text-decoration: underline;
            text-decoration-color: var(--accent);
            text-underline-offset: 3px;
            transition: color 0.2s;
        }

        #editor a:hover {
            color: var(--accent);
        }

        /* YENİ: Kod Bloğu Stilleri (Dark/Terminal Aesthetic) */
        #editor pre {
            background: var(--code-bg);
            border: 1px solid var(--code-border);
            border-radius: 12px;
            padding: 25px;
            margin: 40px 0;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #editor pre code {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--code-text);
            background: none;
        }

        /* Placeholder Logic */
        .placeholder[data-empty="true"]::before {
            content: attr(data-placeholder);
            color: var(--dim);
            pointer-events: none;
            position: absolute;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="toolbar">
            <div class="tb-group">
                <button onclick="format('bold')" title="Kalın (Bold)"><b>B</b></button>
                <button onclick="format('italic')" title="İtalik (Italic)"><i>I</i></button>

                </button>
                <button onclick="insertLink()" title="Link">

                </button>
                <button onclick="format('insertOrderedList')" title="Numaralı Liste">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><text x="1.8" y="7.3" font-size="6" fill="currentColor" stroke="none" font-family="Inter, sans-serif">1</text><text x="1.8" y="13.3" font-size="6" fill="currentColor" stroke="none" font-family="Inter, sans-serif">2</text><text x="1.8" y="19.3" font-size="6" fill="currentColor" stroke="none" font-family="Inter, sans-serif">3</text></svg>
                </button>
                <button onclick="insertCodeBlock()" title="Kod Bloğu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 6 3 12 8 18"/><polyline points="16 6 21 12 16 18"/></svg>
                </button>
            </div>
            <div class="tb-divider"></div>
            <div class="tb-group">
                <button onclick="format('justifyLeft')" title="Sola Yasla">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h14"/></svg>
                </button>
                <button onclick="format('justifyCenter')" title="Ortala">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M5.5 18h13"/></svg>
                </button>
                <button onclick="format('justifyRight')" title="Sağa Yasla">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16"/><path d="M10 12h10"/><path d="M6 18h14"/></svg>
                </button>

        </div>
        <div class="file-actions">
            <input type="file" id="import-input" accept=".html,text/html" style="display: none;" onchange="importHTML(event)">
            <button onclick="document.getElementById('import-input').click()" title="Daha önce export ettiğin bir yazıyı geri yükle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="15" height="15" style="margin-right: 7px; vertical-align: -3px;"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>İçe Aktar
            </button>
            <button class="download-btn" onclick="downloadHTML()" title="Yazıyı yayınlanmaya hazır HTML olarak indir">

    <div class="editor-container">
        <div id="editor" contenteditable="true" class="placeholder" data-placeholder="Yeni yazını buraya girmeye başla...">
            <h1>Yeni Yazı Başlığı</h1>
            <p>Buradan yazmaya başlayabilirsin...</p>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');

        // YENİ ÖZELLİK: Auto-Save (Local Storage) - Sayfa yüklendiğinde kayıtlı taslağı geri yükle
        window.addEventListener('load', function() {
            const savedDraft = localStorage.getItem('blogEditorContent');
            if (savedDraft) {
                editor.innerHTML = savedDraft;
                editor.setAttribute('data-empty', (editor.innerHTML.trim() === '' || editor.innerHTML === '<br>') ? 'true' : 'false');
            }
        });

        // Temel Formatlama
        function format(command, value = null) {
            document.execCommand(command, false, value);
            editor.focus();
        }

        // Sitene Özel Highlight Etiketi Ekleme
        function insertHighlight() {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            
            const range = selection.getRangeAt(0);
            const selectedText = range.toString();
            
            if (selectedText) {
                const span = document.createElement('span');
                span.className = 'highlight';
                span.textContent = selectedText;
                range.deleteContents();
                range.insertNode(span);
            } else {
                const html = `<span class="highlight">Buraya metin girin</span>&nbsp;`;
                document.execCommand('insertHTML', false, html);
            }
            editor.focus();
        }

        // Sitene Özel Blockquote Ekleme
        function insertBlockquote() {
            const html = `
                <br>
                <blockquote contenteditable="true">
                    "Buraya alıntı metnini yazın..."
                </blockquote>
                <br><p>&#8203;</p>
            `;
            document.execCommand('insertHTML', false, html);
        }

        // Sitene Özel Akademik Not Ekleme
        function insertAcademicNote() {
            const html = `
                <br>
                <div class="academic-ref" contenteditable="true">
                    <strong>Academic Note:</strong><br>
                    Buraya akademik referans metnini yazın...
                </div>
                <br><p>&#8203;</p>
            `;
            document.execCommand('insertHTML', false, html);
        }

        // YENİ ÖZELLİK: Link Ekleme (Seçili metni <a href="..."> ile sarmalar)
        function insertLink() {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.toString().trim() === '') {
                alert('Lütfen önce link eklemek istediğiniz metni seçin.');
                return;
            }
            const url = prompt("Link URL'sini girin:", 'https://');
            if (url) {
                document.execCommand('createLink', false, url);
            }
            editor.focus();
        }

        // YENİ ÖZELLİK: Kod Bloğu Ekleme (Dark/Terminal Aesthetic)
        function insertCodeBlock() {
            const html = `
                <br>
                <pre contenteditable="true"><code>Buraya kod bloğunuzu yazın...</code></pre>
                <br><p>&#8203;</p>
            `;
            document.execCommand('insertHTML', false, html);
        }

        // Dışarıdan kopyalanan metinlerin stilini temizleyerek (Plain Text) yapıştırma
        editor.addEventListener('paste', function(e) {
            e.preventDefault();
            const text = (e.originalEvent || e).clipboardData.getData('text/plain');
            document.execCommand('insertText', false, text);
        });

        
        // Enter (Satır Atlama) Tuşunun Özel Kutulardaki Davranışını Düzeltme
        editor.addEventListener('keydown', function(e) {
            // Eğer Enter'a basıldıysa (ve Shift'e basılmadıysa)
            if (e.key === 'Enter' && !e.shiftKey) {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                
                let node = selection.anchorNode;
                let isInsideCustomBlock = false;
                
                // İmlecin (cursor) bir alıntı (blockquote) veya akademik not (academic-ref) içinde olup olmadığını bul
                while (node && node !== editor) {
                    if (node.nodeName === 'BLOCKQUOTE' || node.nodeName === 'PRE' || node.nodeName === 'CODE' || (node.classList && node.classList.contains('academic-ref'))) {
                        isInsideCustomBlock = true;
                        break;
                    }
                    node = node.parentNode;
                }

                // Eğer özel kutunun içindeysek, tarayıcının kutuyu ikiye bölmesini engelle ve sadece alt satıra geç (<br> ekle)
                if (isInsideCustomBlock) {
                    e.preventDefault();
                    document.execCommand('insertLineBreak');
                }
            }
        });

        // Placeholder Kontrolü
        editor.addEventListener('input', function() {
            if (this.innerHTML.trim() === '' || this.innerHTML === '<br>') {
                this.setAttribute('data-empty', 'true');
            } else {
                this.setAttribute('data-empty', 'false');
            }
        });

        // YENİ ÖZELLİK: Auto-Save (Local Storage) - Her yazıda otomatik kaydet
        editor.addEventListener('input', function() {
            localStorage.setItem('blogEditorContent', editor.innerHTML);
        });

        // YENİ ÖZELLİK: İçe Aktarma (Import) - Daha önce export edilmiş bir yazıyı tekrar düzenlemek için geri yükler
        function importHTML(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (editor.innerHTML.trim() !== '' && !confirm('İçe aktarma, editördeki mevcut içeriğin üzerine yazacak. Devam etmek istiyor musunuz?')) {
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const parser = new DOMParser();
                const importedDoc = parser.parseFromString(e.target.result, 'text/html');
                const article = importedDoc.querySelector('article');

                if (!article) {
                    alert('Bu dosya tanınamadı. Lütfen bu editörden export edilmiş bir HTML dosyası seçin.');
                    event.target.value = '';
                    return;
                }

                // Export sırasında eklenen <hr> ve <footer>'ı çıkar, sadece asıl yazı içeriğini al
                const clone = article.cloneNode(true);
                const hr = clone.querySelector('hr');
                if (hr) hr.remove();
                const footer = clone.querySelector('footer');
                if (footer) footer.remove();

                editor.innerHTML = clone.innerHTML.trim();
                editor.setAttribute('data-empty', (editor.innerHTML.trim() === '' || editor.innerHTML === '<br>') ? 'true' : 'false');

                // Programatik değişiklik 'input' event'ini tetiklemez, Auto-Save'i elle güncelle
                localStorage.setItem('blogEditorContent', editor.innerHTML);

                event.target.value = '';
            };
            reader.onerror = function() {
                alert('Dosya okunurken bir hata oluştu.');
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        // İndirme (Export) Fonksiyonu
        function downloadHTML() {
            const content = editor.innerHTML;
            
            const today = new Date();
            const dateString = today.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            
            // YENİ ÖZELLİK: Okuma süresini kelime sayısına göre hesapla (200 kelime = 1 dakika)
            const wordCount = editor.textContent.trim().split(/\s+/).filter(Boolean).length;
            const readingTime = Math.max(1, Math.ceil(wordCount / 200));
            
            const finalHTML = `

        .nav-overlay.open .nav-link:nth-child(5) { transition-delay: 0.5s; }

        @keyframes fadeInUI { to { opacity: 1; } }

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-mode');
            
            if (body.classList.contains('light-mode')) {
                localStorage.setItem('theme', 'light');
            } else {
                localStorage.setItem('theme', 'dark');
            }
        }

            if (savedTheme === 'light') {

            }
        }

        // YENİ ÖZELLİK: Başlığı URL-dostu bir slug'a dönüştürür (Türkçe karakter desteğiyle)
        function slugify(text) {
            const trMap = {
                'ç': 'c', 'Ç': 'c', 'ğ': 'g', 'Ğ': 'g',
                'ı': 'i', 'I': 'i', 'İ': 'i',
                'ö': 'o', 'Ö': 'o', 'ş': 's', 'Ş': 's',
                'ü': 'u', 'Ü': 'u'
            };

            return text
                .split('')
                .map(char => trMap[char] !== undefined ? trMap[char] : char)
                .join('')
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-+|-+$/g, '');
        }
